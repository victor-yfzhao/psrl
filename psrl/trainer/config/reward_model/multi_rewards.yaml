# configs for the reward model
launch_reward_fn_async: True

reward_normalization: group

reward_models:
  - reward_loop_type: naive
    reward_fn: 
      - default

  - reward_loop_type: dapo
    reward_fn: 
      - default
    reward_loop_kwargs:
      max_resp_len: 5120
      overlong_buffer_cfg:
        enable: True
        len: 3072
        penalty_factor: 1.0
        log: False

