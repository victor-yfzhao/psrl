# Whether colocate rollout and trian workers
colocate: False

# IP address of parameter server managaer.
ps_manager_ip: 127.0.0.1

# IP address of reward service.
reward_service_ip: ${psrl.ps_manager_ip}

# Staleness control of training data.
staleness: 0

# Size of each staleness buffer (i.e. training batch)
staleness_buffer_entries: 512

# number of responses (i.e. num sample times). > 1 for grpo
rollout_n: 1

# Weight synchronization mode for parameter server: cpu_ref or nixl_cpu
ps_mode: cpu_ref

# Logging path
logging_path: ~/psrl_logs

server_rollout:
  # Whether to enable server rollout service.
  enable: False

  # Rollout gateway config.
  # This gateway is an HTTP entrypoint used by agent loops to call rollout service.
  gateway:
    # Bind address for the gateway process.
    router_ip: ${psrl.ps_manager_ip}
    router_port: 18080

  # Max concurrent connections per rollout server for the HTTP client.
  server_concurrency: 64

# Config for profile
profile:

  # Whether to disable the attention (Qwen2/2.5/3/3.5) for profiling
  disable_attn: False

  # Whether to fix the weight of the model
  # Useful for analysis
  fix_weight: False

# Config for logprobs
log_prob:

  # Whether to return logprobs from rollout engines
  enable_rollout_engine_log_prob: True

  # On a partial-rollout continuation, replace the saved response logprobs
  # with the values recomputed by the reprefill instead of appending a second
  # copy of the prefix. Disabled by default for backward compatibility.
  update_reprefill_log_probs: False

# Worker deployment and resource allocation
deployment:

  # Unified deployment mode selector. Selects how rollout / reward-model / trainer
  # pools are laid out and orchestrated. Available options:
  #  - disaggregated:       (mode 1) rollout/rm/trainer each in independent pools,
  #                          concurrent async pipeline. Existing default path.
  #  - colocated:           (mode 2) all three roles share one pool, time-multiplexed
  #                          per training step via sleep/wake (rollout -> rm -> train).
  #  - rollout_rm_colocated: (mode 3) rollout+rm share shared_rollout_pool, time-multiplexed
  #                          per buffer; trainer on a separate train_pool, pipelined via
  #                          staleness.
  #  - trainer_pool_only:   (mode 4) three independent pools, but while the trainer is
  #                          idle a FIXED number of rollout/rm replicas are woken on
  #                          train_pool GPUs (no elastic auto-scaling); slept on training step.
  #  - elastic_rl:          (mode 5) current elastic auto-scaling between rollout and rm.
  # null (default) preserves backward compatibility: mode is inferred from
  # elastic_rm.enable / colocate.
  mode: null

  # Experimental disaggregated-rollout interruption. When enabled together
  # with mode=disaggregated, all in-flight rollout requests are interrupted at
  # this interval and sent through the normal partial-rollout router again.
  # Validation requests are excluded by the router.
  disaggregated_rollout_interrupt:
    enable: False
    interval_s: 0.0

  # ---- Launch presets (override on the command line, e.g. psrl.deployment.mode=colocated) ----
  # Mode 1 (disaggregated):  psrl.deployment.mode=disaggregated
  #   Three independent pools (rollout_pool_i / reward_pool_{name}_i / train_pool).
  #   Requires: psrl.ps_mode in {nixl_cpu, nixl_gpu} only if you want sleep/wake; otherwise any.
  # Mode 2 (colocated):      psrl.deployment.mode=colocated
  #   All three roles share train_pool, time-multiplexed per step (rollout -> rm -> train).
  #   Requires: psrl.ps_mode in {nixl_cpu, nixl_gpu}; reward_models_config.launch_reward_fn_async=true;
  #             psrl.staleness=0; psrl.colocate_validate_and_train=false.
  # Mode 3 (rollout_rm_colocated): psrl.deployment.mode=rollout_rm_colocated
  #   rollout+rm share shared_rollout_pool (per-buffer rollout->reward); trainer on train_pool.
  #   Requires: psrl.ps_mode in {nixl_cpu, nixl_gpu}; launch_reward_fn_async=true; psrl.staleness=0.
  # Mode 4 (trainer_pool_only): psrl.deployment.mode=trainer_pool_only
  #   Three independent pools + fixed extra rollout/rm replicas on train_pool while trainer idle.
  #   Set trainer_pool_idle_rollout_instances / trainer_pool_idle_rm_instances > 0 to enable.
  #   Requires: psrl.ps_mode in {nixl_cpu, nixl_gpu}.
  # Mode 5 (elastic_rl):     psrl.deployment.mode=elastic_rl
  #   Current elastic auto-scaling (elastic_rm.enable=true + enable_policy=true).

  # Fixed number of rollout / reward-model replicas woken on train_pool GPUs while the
  # trainer is idle. Only used by `trainer_pool_only` mode. 0 disables idle reuse.
  trainer_pool_idle_rollout_instances: 0
  trainer_pool_idle_rm_instances: 0

  # auto-scaling between rollout and reward model
  elastic_rm:
    # Whether to enable auto-scaling between rollout and reward model
    enable: False

    # Number of nodes for shared resource pool
    shared_nnodes: 1

    # GPU number for each node in shared resource pool. May be a scalar or a
    # per-node list with length shared_nnodes, e.g. [4, 8].
    shared_ngpus_per_node: 8

    # Whether trainer GPUs may be reused by rollout/reward-model replicas while the trainer sleeps.
    # When enabled, train_pool is split with the same bundle-placement rules as shared_rollout_pool,
    # but instances from different pools never exchange bundles.
    enable_trainer_pool: False

    # Whether to enable policy-based scaling decisions in ElasticExecutor monitor loop
    enable_policy: True

    # Policy implementation variant:
    # - normal: use ScalingPolicy (default)
    # - dummy: use DummyScalingPolicy (free-GPU only, no preemption when busy)
    # - itl: use ITLScalingPolicy (optimizes ITL/F/L objective, bottleneck throughput)
    # - itl_harmonic: use ITLHarmonicScalingPolicy (same as itl but optimizes the
    #   weighted harmonic mean of Rollout/RM throughput instead of the bottleneck min)
    # - rule_based: use KV-cache high/low thresholds; expand only onto idle devices,
    #   route requests back through the router on shrink, and do no post-expand rebalance
    scaling_policy_variant: normal

    # Non-preemptive KV-cache rule-based policy parameters. These default to the
    # common thresholds below but can be tuned independently for this policy.
    rule_based_policy:
      scale_up_threshold: ${psrl.deployment.elastic_rm.theta_max}
      scale_down_threshold: ${psrl.deployment.elastic_rm.theta_low}

    # ITL/F/L policy parameters. A/B/C/D follow:
    #   ITL = A * total_token_num + max(B, C * running_queue_num) + D
    # `migrate_time_s_initial` seeds the first decision. Later decisions use an
    # EWMA of observed SLEEP + WAKE_UP time from ElasticExecutor.
    itl_policy:
      decision_window_s: 60.0
      migrate_time_s_initial: 5.0
      migrate_time_ewma_alpha: 0.2
      min_gain: ${psrl.deployment.elastic_rm.hysteresis}
      # Experimental request-snapshot evaluator. False preserves candidate
      # scoring and the existing post-scale-up rebalance path byte-for-byte.
      enable_request_level_candidate_evaluation: true
      # Skip all post-scale-up ABORT when false, including the older ratio-based
      # waiting-queue interrupt used when request-level evaluation is off.
      rebalance_after_scale_up: true
      # When enabled, pause normal router dispatch while a request-level
      # rebalance is active. Interrupted requests are redispatched FIFO to the
      # destinations chosen by candidate simulation, bypassing normal routing
      # admission and ranking rules.
      exclusive_rebalance_migration_queue: false
      candidate_evaluation_max_workers: 64
      # Candidate simulation implementation: python or cpp. The C++ backend
      # keeps one JSONL evaluator process alive for the policy lifetime.
      candidate_evaluation_backend: python
      # null resolves to build/elastic_simulator/elastic_simulator under the
      # repository root. An explicit path may be used for packaged binaries.
      candidate_evaluation_cpp_binary: null
      candidate_evaluation_cpp_timeout_s: 30.0
      # For itl_harmonic only: false uses the standard sum denominator;
      # true uses max(w_rollout / rollout_tp, w_rm / rm_tp).
      harmonic_denominator_use_max: false
      # Objective mode:
      # - balanced_min: keep the historical balanced-load bottleneck estimate.
      # - sum: use min(sum(instance throughput for Rollout), sum(instance throughput for RM)).
      throughput_objective: sum
      # Which vLLM queues are counted as current instance load in ITL/F estimates.
      # - running_waiting: use vLLM running + vLLM waiting (legacy behavior).
      # - running: use only vLLM running; router waiting top-T is still counted separately below.
      vllm_current_queue_scope: running
      # Max number of same-role instances a single ITL decision may wake or sleep.
      # 1 keeps the original one-step candidate search.
      # -1 disables the per-action cap (still bounded by available instances).
      max_scale_instances_per_action: -1
      # Enable GPU-bundle-aware wake plans when rollout and RM replicas use
      # different power-of-two parallel sizes. Equal-size roles retain the
      # established count-prefix candidate path even when this is true.
      enable_heterogeneous_parallelism_candidates: false
      # Number of leading router waiting sequences to include in ITL F/F' estimates.
      # -1 includes all router waiting requests; 0 disables router-waiting load in the objective.
      router_waiting_top_t: -1
      # Whether current-state F includes router waiting load distributed over awake instances.
      current_state_include_router_waiting: false
      # Per-role throughput weighting by router + in-instance pressure.
      # When enabled, system throughput becomes
      #   min(rollout_tp / w_rollout, rm_tp / w_rm)
      # so the side carrying more pressure is more likely to be flagged as the
      # bottleneck. Pressure aggregates in-instance running/waiting load plus
      # router backlog.
      role_throughput_weight_enable: true
      # Pressure basis for the divisors above:
      # - request_count: weight by per-role total request count.
      # - token_count:   weight by per-role total token count.
      # - none:          disable weighting even if role_throughput_weight_enable is true.
      role_throughput_weight_basis: request_count
      # How pressure is turned into the per-role throughput divisor:
      # - share (default): w_role = role_pressure / (rollout_pressure + rm_pressure)
      #     (normalized share summing to 1; uniform 0.5/0.5 when both sides idle).
      # - raw:             w_role = role's raw pressure value (its request count or
      #     token count) directly; heavier pressure penalizes the side far more
      #     aggressively. A side with zero pressure falls back to divisor 1.0.
      role_throughput_weight_mode: raw
      # Directory of {model_stem}.json files, or a single JSON path; stem is derived from model_name.
      # Decoupled from psrl.routing_strategy.cost_model_path: the ITL scaling policy and the
      # request router are independent consumers and may point at different cost-model dirs.
      cost_model_path: psrl/trainer/config/cost_model
      model_params: {}
      rm_router_enable: true
      # Optional stop-routing threshold: if ITL(load + 1) for every available
      # RM worker is above this value, keep requests in the router queue.
      # null means no ITL threshold.
      rm_router_max_itl: null

    # Monitor interval for elastic policy loop
    monitor_interval_ms: 1000

    # Max seconds per monitor tick to wait on coordinator Ray RPCs (engine snapshot + router backlog).
    # Prevents the monitor from hanging silently if a coordinator/router blocks; <=0 disables the cap.
    coordinator_sync_timeout_s: 10

    # Max seconds for each SLEEP/WAKE_UP/ABORT exec_command from ElasticExecutor to a coordinator.
    # Omit or 0 = wait indefinitely. When set, avoids pending stuck forever if a worker/router hangs.
    # NOTE: must be generous enough to cover model load time (typically 20-30s) plus any queuing
    # delay in the coordinator command handler.  60s was too aggressive and caused spurious timeouts.
    coordinator_command_timeout_s: 180

    # Keep the trainer awake briefly when the next buffer is not ready yet.
    # This avoids paying a 10-15s trainer wake cost for short generation gaps.
    trainer_ready_grace_s: 5

    # Consecutive monitor ticks while policy is blocked by an unfinished scale decision; at this
    # count, emit a high-severity diagnostic. The live transition lease is never abandoned because
    # allowing a second decision to overlap an unknown first decision corrupts instance state.
    # Rough wall time ≈ ticks * (monitor_interval_ms / 1000), e.g. 180 ticks @ 1000ms ≈ 3 minutes.
    decision_execution_abandon_stall_ticks: 360

    # Wake-up immunity window (ms): after an instance wakes up (or completes an in-place
    # model sync), it is protected from being scaled down for this duration.
    # Prevents the rapid sleep-wake oscillation that occurs when the scaling policy sees
    # zero throughput on a freshly-woken or mid-sync instance and immediately scales it
    # back down.  Set to 0 to disable.
    wakeup_immunity_ms: 10000

    # Metric used by theta_low/theta_max thresholds for elastic scaling decisions.
    # Available options:
    # - kv_cache: scheduler_stats.kv_cache_usage
    # - running_request_num: scheduler_stats.num_running_reqs
    # - waiting_request_num: scheduler_stats.num_waiting_reqs
    # - total_request_num: num_running_reqs + num_waiting_reqs
    load_threshold_metric: kv_cache

    # Low-load threshold under `load_threshold_metric` below which an instance can cede resources
    theta_low: 0.1

    # Full-load threshold under `load_threshold_metric` above which an instance is considered full-load
    theta_max: 0.8

    # Cooldown window after each scaling action to avoid oscillation
    cooldown_ms: 20000

    # Minimum bottleneck throughput gain required for one-step transfer
    hysteresis: 0.05

    # Minimum number of awake instances kept for each role.
    # Set to 0 to allow one side to fully sleep.
    min_awake_per_role: 1

    # Priority-3 scale-down guard: even if KV cache is below theta_low, do not shrink if the
    # selected scale-down candidate still has too many requests waiting in its local queue.
    # 0 means: candidate must have no waiting requests to be shrinkable.
    max_waiting_queue_for_scale_down: 64

    # After scale-up, rebalance by ABORTing selected donor-side requests so the router
    # can place them on newly-awakened instances. Donor score =
    # request_weight * over_request_ratio + length_weight * over_length_ratio.
    post_scale_up_rebalance_request_weight: 0.6
    post_scale_up_rebalance_length_weight: 0.4

    # Periodically ABORT waiting-only uids so the router can see them. Independent
    # of scaling_policy_variant. False keeps the vLLM-scheduler-only path.
    interrupt_vllm_waiting_when_running_only: true
    interrupt_vllm_waiting_interval_s: 2.0
    interrupt_vllm_waiting_ratio: 1.0

    # Optional map {model_name: profile_json_path} for new throughput profile schema
    profile_paths: {}

    # Throughput-model directory containing {model_name}_token.json and fitted formula
    throughput_model_dir: psrl/trainer/config/throughput_model

    # Use token-throughput fit bucket by output length (default 1024)
    throughput_model_output_len: 1024

    # EWMA alpha for arrival rate estimation
    lambda_ewma_alpha: 0.2

    # Full load mode for scaling policy
    # Available options: "all", "any"
    # "all": all instances must be full load to scale up
    # "any": any instance can be full load to scale up
    full_load_mode: any

  # Number for rollout instances
  n_rollout_instances: 1

  # Number for validation rollout instances
  n_validate_instances: 1

  # Node number for each rollout instance
  rollout_nnodes_per_instance: 1

  # GPU number for each rollout instance in every node
  rollout_ngpus_per_node_per_instance: 1

  # Node number for each validate instance
  validate_nnodes_per_instance: 1

  # GPU number for each validate instance in every node
  validate_ngpus_per_node_per_instance: 1

  # Node number for trainer
  train_nnodes: 1

  # GPU number for trainer in every node
  train_ngpus_per_node: 1

  # Total number of GPU nodes this job needs across all roles.
  # When set, excess nodes in the Ray cluster are blocked from scheduling
  # so that colocated validate workers cannot spill onto idle nodes.
  # Set to the same value as NNODES in the launch script.
  # null means no restriction (default).
  total_nnodes: null
  
  # Rollout with heterogeneous strategies across different instances
  heterogeneous_rollout:

    # Whether to enable heterogeneous strategies for different rollout instances.
    enable: False

    # Number for rollout instances
    n_rollout_instances: ${psrl.deployment.n_rollout_instances}

    # Node number for each rollout instance
    rollout_nnodes_per_instance: []

    # GPU number for each rollout instance in every node
    rollout_ngpus_per_node_per_instance: []

    # Tensor model parallel size for each rollout instance.
    tensor_model_parallel_size_per_instance: []

    # Pipeline model parallel size for each rollout instance.
    pipeline_model_parallel_size_per_instance: []

# Collect rollout instance status to rollout coordinator for global dp load balance
status_collection:

  # whether to enable the status collection.
  enable: True

  # The level of logging to file
  # Available options: "none", "partial_rollout", "prompt", "generation", "all"
  dump_logging_to_file_level: generation

  # Logging interval in milliseconds
  dump_logging_to_file_interval_in_ms: 500

  # Engine status sync interval in millisecond (each vllm engine -> rollout coordinator)
  # Here 10 means sync every 0.1 second
  engine_sync_interval_in_ms: 100

  # Coordinator sync interval in millisecond (rollout coordinator after collecting engine status from all vllm engines -> router)
  # Here 10 means sync every 0.1 second
  coordinator_sync_interval_in_ms: 100

# Memory logger config
memory_logger:

  # Whether to enable memory logger
  enable: True

  # Logging interval in seconds
  interval_seconds: 30

# Redundant rollout config
redundant_rollout:

  # Whether to enable redundant rollout
  enable: False

  # Global batch size for algorithm requirement
  alg_global_batch_size: ${psrl.staleness_buffer_entries}

  # Number of responses for algorithm requirement
  alg_rollout_n: ${psrl.rollout_n}

  # Actual global batch size (>= algorithm requirement)
  redundant_global_batch_size: ${psrl.staleness_buffer_entries}

  # Actual number of responses (>= algorithm requirement)
  redundant_rollout_n: ${psrl.rollout_n}

# Partial rollout config
partial_rollout:

  # Whether to enbale partial rollout
  enable: False

  # Whether view interrupted trajectories as new prompts
  interrupt_as_prompt: False

  # Emit request-level version and sequence-boundary audit events.  This is
  # intended for elastic partial-rollout diagnosis and is disabled by default.
  trace:
    enable: true

# Rollout routing strategy config
routing_strategy:

  # Method for rollout routing
  # Available options: "random", "round_robin", "request_num_balance", "throughput_optimal", "throughput_optimal_with_budget"
  # If using "request_num_balance" or "throughput_optimal" or "throughput_optimal_with_budget", you need to enable status collection.
  method: request_num_balance

  # Check interval in millisecond for rollout routing
  check_interval_in_ms: 500

  # Whether to prioritize short requests
  # Available options: "short_length", "long_length", "small_id"
  request_sort_indicator: small_id

  # Whether to sort the candidates by indicator 
  # Available options: "version", "reserve_capability"
  candidate_sort_indicator: version

  # Whether to enable multiple priority queues for routing requests
  enable_multi_priority_queue: False

  # Whether to enable group sampling on multiple instances
  enable_group_sampling_on_multi_instances: True

  # Logging interval in milliseconds
  logging_interval_in_ms: 2000

  # Path to the cost model: a JSON file or a directory resolved by rollout model_name.
  cost_model_path: psrl/trainer/config/cost_model

  # Delta throughput threshold to stop request routing to an instance
  delta_throughput_threshold: 0.5

  # Request budget in tokens for each request
  # It is used to estimate the length of the response tokens
  request_budget: 1024

  # Snapshot staleness threshold in milliseconds
  # Here snapshot_staleness_threshold_ms is the time difference between the last time record and the snapshot time of the engine status.
  snapshot_staleness_threshold_in_ms: 1000

  # Max number of waiting requests per instance after preemption
  max_num_waiting_reqs_after_preemption: 1000

  # Max estimated concurrent sequences per instance
  # No need to tune this value, it is only used to estimate the max sequence length that can saturate the KV Cache
  max_estimated_concurrent_seqs_per_instance: 32768

  # The actual max number of concurrent sequences per instance
  max_concurrent_seqs_per_instance: 1024

# Model synchronization and rollout migration strategy config
sync_and_mig_strategy:

  # Method for model synchronization and rollout migration
  # Available options: "status_based" or "greedy"
  method: greedy

  # Check interval in millisecond for model synchronization and rollout migration
  check_interval_in_ms: 100

  # Model synchronization config
  sync:
    # Indicator for model synchronization
    # Available options: "request_num", "throughput", "kv_cache", "hypothesis_test"
    # request_num: we check if the number of requests is lower than the threshold
    # throughput: we check if the throughput is lower than the threshold
    # kv_cache: we check if the KV Cache is saturated
    # hypothesis_test (TODO): we check if there are any benefits from synchronization
    indicator: request_num
  
    # Workload threshold to trigger model synchronization
    # When indicator is "request_num", threshold is the number of requests.
    # When indicator is "throughput", threshold is the throughput.
    # When indicator is "kv_cache", threshold is the KV Cache utilization.
    # When indicator is "hypothesis_test", threshold is not used.
    threshold: null

    # Whether to check the request that can be routed to the instance before synchronization
    check_req_before_sync: True

    # All versions in [0, seamless_train_version] satisfy that:
    # - After pulling the model from the PS, the next buffer is already ready, so the training can be continued seamlessly without waiting for rollout
    seamless_train_version: 0

  # Rollout migration config
  mig:
    # Whether to enable rollout migration
    enable: False

    # Indicator for rollout migration
    # Available options: "request_num", "throughput", "kv_cache"
    indicator: request_num

    # Relative threshold for rollout migration
    # When the indicator of the instance with the max indicator value divided by the indicator of the instance with the min indicator value is greater than the threshold, 
    # the rollout coordinator will abort all rollout requests of the instance with the max indicator value (the requests will loop back to the router).
    threshold: null

    # Stop migration when the indicator is less than the threshold
    # Available options: "request_num", "throughput", "kv_cache"
    stop_indicator: request_num

    # Threshold for stopping migration
    stop_threshold: null

# Filter strategy
proactive_filter_strategy:

  # Method for proactive filter strategy
  # Available options: "null", "retry", "truncate"
  method: null

  # Threshold of retry/truncate requests per buffer
  # When the buffer is not ready but the training side is waiting for it
  # We will trigger the retry/truncate strategy when the number of remaining reserved entries is smaller than this value
  threshold: 0

# NIXL config for `nixl_cpu` weight synchronization
# NOTE: With ps_mode nixl_*, GenWorker does not use TMS LD_PRELOAD (incompatible with UCX registerMem).
nixl:

  # Server IP address
  server_ip: ${psrl.ps_manager_ip}

  # Server port
  server_port: 23456

  # Bound concurrent metadata/communication-plan notifications because each payload can be large.
  metadata_broadcast_max_workers: 8

  # Covers server-side info collection, communication planning, and metadata distribution.
  metadata_server_info_timeout_s: 1200

  # Pinned temp memory slots num for non-contiguous transfer
  max_pinned_temp_memory_slots: 64

  # Enable TMS management for NIXL temp buffers
  enable_tms_for_temp_buffers: ${psrl.tms.enable_nixl}

  # Versioned diagnostics for locating model-content divergence across NIXL
  # transfers and trainer sleep/wake restoration. Sampled fingerprints read a
  # fixed set of positions from every logical tensor; full fingerprints hash
  # every byte and should be enabled only at a low frequency for large models.
  weight_verification:
    enable: false
    transfer_chain: true
    trainer_sleep_wake: true
    sample_every_n_versions: 1
    full_every_n_versions: 0
    sample_count_per_tensor: 16
    full_hash_chunk_bytes: 67108864
    include_tensor_digests: true
    fail_on_mismatch: false

  # Pack model weight storages into a small number of real CUDA allocations.
  # NIXL still transfers one logical descriptor per model tensor.
  weight_arena:
    actor_enabled: true
    rollout_enabled: true
    reward_enabled: true
    # node_shared builds distinct topology ranks concurrently from lazy
    # safetensors mappings, then stores one final arena shard per topology rank
    # in node-local memory; duplicate instances map the same physical pages.
    # process_local retains the anonymous CPU mirror as a rollback option.
    reward_cpu_cache_mode: node_shared
    reward_node_cache_dir: /dev/shm/psrl-rm-weight-cache
    # auto uses one tmpfs arena when the whole node has room, otherwise one
    # sealed DRAM-backed memfd arena shared through the node-local broker.
    reward_node_cache_backend: auto
    # Keep enough tmpfs headroom for the 128 GiB Plasma cap plus 64 GiB of
    # runtime communication buffers; otherwise auto selects memfd before writing.
    reward_node_cache_shm_reserve_gb: 192
    reward_node_cache_memfd_reserve_gb: 256
    reward_node_cache_wait_timeout_s: 1800
    reward_cpu_cache_pin_memory: false
    # direct writes the initial weights into their final arena allocation;
    # repack retains the previous load-then-copy implementation for rollback.
    actor_materialization: direct
    rollout_materialization: direct
    reward_materialization: repack
    max_chunk_gb: 16
    alignment_bytes: 256

# Post processor for group requests in streaming mode
group_post_process:

  # Whether to enable group post-processing
  enable: False

  # Name of the registered group post-processor to use
  # Available options: "dynamic_sampling_filter", "no_filter"
  # When name is "dynamic_sampling_filter", requires algorithm.filter_groups.metric to be set
  name: null

# Post processor for buffer requests in batch mode
buffer_post_process:

  # Whether to enable buffer post-processing
  enable: False

  # Name of the registered buffer post-processor to use
  # Available options: "dynamic_sampling_filter", "no_filter"
  # When name is "dynamic_sampling_filter", requires algorithm.filter_groups.metric to be set
  name: null

# Whether to colocate validate and training workers
colocate_validate_and_train: True

# Whether to dispatch requests to both rollout and validate instances (when validate workers exist)
fuse_rollout_with_validate: False

# Whether to use torch_memory_saver (TMS) for GPU management
tms:

  # Range of TMS to enable, available options:
  #  - "null": disable TMS
  #  - "train": enable TMS for training workers only
  #  - "all": enable TMS for both rollout and training workers
  range: all

  # Whether to enable TMS on CUDA graphs
  # When enabled, CUDA graphs will be released by TMS to save GPU memory
  # This requires range to be "all"
  enable_cuda_graph: True

  # Whether to enable TMS on NIXL temp buffers
  # When enabled, NIXL temp buffers will be released by TMS to save GPU
  # and the reregister will be simplified.
  enable_nixl: True
